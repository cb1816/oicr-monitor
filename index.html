.flbl{font-size:10.5px;color:var(--mut);margin:8px 2px 4px}

.rank.t{color:var(--pos)}.rank.b{color:var(--neg)}
.info{flex:1;min-width:0}
.nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.val{flex:0 0 auto;text-align:right;min-width:66px}
.pct{font-size:16px;font-weight:800}
.pos{color:var(--pos)}.neg{color:var(--neg)}.zero{color:var(--mut)}
.stars{font-size:10px;color:var(--warn);margin-top:1px;letter-spacing:1px}
.badges{margin-top:2px;display:flex;gap:4px;flex-wrap:wrap}
.qbadge{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:5px}

.mbadge{background:rgba(255,122,69,.18);color:var(--hot)}

.sec.flop{color:var(--neg)}.sec.top{color:var(--pos)}.sec.hot{color:var(--hot)}
.empty{color:var(--mut);text-align:center;padding:40px 10px;font-size:13px}
.catcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.cathead{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer}

.mini{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:12.5px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer}

.mlbl{font-size:10px;color:var(--mut);margin:6px 0 2px;text-transform:uppercase;letter-spacing:.5px}
.sortrow{display:flex;gap:6px;margin:10px 4px 4px}
.sortrow .sc{font-size:11.5px;font-weight:700;color:var(--mut);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
.sortrow .sc.on{background:var(--panel2);color:var(--txt);border-color:var(--accent)}
.ov{position:fixed;inset:0;background:rgba(4,8,16,.7);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.ov{overscroll-behavior:contain}
html.lock,html.lock body{overflow:hidden}html.lock body{position:fixed;left:0;right:0;width:100%}

.chartbox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 8px 4px;margin-top:4px}

.chleg{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);padding:2px 4px 0}

.maprow:active{background:var(--panel2)}
.mlbl2{flex:0 0 42%;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:7px}
.mlbl2 .cn2{color:var(--txt)}.mlbl2 small{color:var(--mut)}
.mval2{flex:0 0 54px;text-align:right;font-size:12.5px;font-weight:800}
.mbarwrap{position:relative;flex:1;height:15px}

.agg{color:var(--warn);font-weight:600}
.msLink{display:inline-block;margin-top:6px;font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
/* Confronto fondi (01/10/2026) */
.cmpbtn{display:inline-block;margin:0 0 4px;font-size:12.5px;font-weight:700;color:var(--accent);background:var(--chip);border:1px solid var(--accent);border-radius:999px;padding:6px 14px;cursor:pointer}
.cmpbtn.on{background:var(--accent);color:#04101f}

.cmpn{font-size:11.5px;color:var(--mut);margin-left:4px}
.cmpclr{background:none;border:none;color:var(--mut);font-size:12px;font-weight:600;padding:6px;cursor:pointer}
.cmpgo{background:var(--accent);color:#04101f;border:none;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:800;cursor:pointer}
.cmpgo:disabled{background:var(--chip);color:var(--mut)}
body.hascmp .wrap{padding-bottom:150px}
body.hascmp #etfLink{bottom:calc(132px + env(safe-area-inset-bottom)) !important}
.cmpchart svg{height:auto}
.cmpleg{display:flex;flex-direction:column;gap:3px;margin:8px 2px 0;font-size:12px}
.cmpleg span{display:flex;align-items:center;gap:6px;min-width:0}
.cmpleg i{flex:0 0 14px;height:3px;border-radius:2px}
.cmpleg i.dash{background:repeating-linear-gradient(90deg,#93a1b8 0 4px,transparent 4px 7px)}
.cmpleg b{margin-left:auto;padding-left:8px}
.cmpwrap{overflow-x:auto;overscroll-behavior-x:contain;margin:0 -4px;padding:0 4px}
.cmptab{border-collapse:collapse;width:100%;font-size:12px;min-width:340px}
.cmptab th,.cmptab td{padding:5px 6px;text-align:right;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap}
.cmptab th{vertical-align:top;font-size:11px;font-weight:700;color:var(--txt);white-space:normal;min-width:74px;max-width:110px;line-height:1.25}
.cmptab th i{display:block;height:4px;border-radius:2px;margin-bottom:4px}

.cmprm{display:block;margin:4px 0 0 auto;background:none;border:1px solid var(--line);color:var(--mut);border-radius:6px;font-size:10px;padding:1px 6px;cursor:pointer}

.cmptab td.best{font-weight:800;color:var(--pos);background:rgba(34,197,94,.10);border-radius:4px}
.cmpcat{display:inline-block;white-space:normal;max-width:110px;font-size:10.5px;color:var(--mut);text-align:right}
.cmpbest{text-transform:none;letter-spacing:0;color:var(--pos);font-weight:600;margin-left:6px}
.cmpcorr td{text-align:center}.cmpcorr td:first-child{max-width:130px;overflow:hidden;text-overflow:ellipsis}
.cmpcorr .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.c4{background:rgba(244,83,107,.22);color:#ffb3c0}.c3{background:rgba(245,182,66,.18);color:#ffd88a}.c2{background:rgba(79,156,255,.16);color:#a9cdff}.c1{background:rgba(34,197,94,.16);color:#8ff0b3}
.cl{display:inline-block;border-radius:5px;padding:0 5px;margin:2px 2px 0 0;font-size:10.5px}
/* Barra di My Way: ← My Way · Portafogli · Fondi · ETF (Magüt), 28/09/2026 */
.suite{max-width:760px;margin:0 auto 8px;display:flex;gap:6px;flex-wrap:wrap}
.suite a,.suite span,.suite button{font-size:12px;font-weight:600;color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;line-height:1.4;background:none;font-family:inherit;cursor:pointer}
.suite span{color:#04101f;background:var(--accent);border-color:var(--accent)}

@media (hover:none) and (pointer:coarse){#clienti{display:none !important}}
/* Layout PC (standard della suite, come ETF Monitor v3): solo schermi larghi con mouse. Telefono invariato. */
@media (min-width:1024px) and (hover:hover) and (pointer:fine){
:root{--side:300px;--maxw:1240px}
body{padding-left:var(--side)}
.side{display:flex;flex-direction:column;gap:12px;position:fixed;left:0;top:0;bottom:0;width:var(--side);overflow-y:auto;background:#0d1626;border-right:1px solid var(--line);padding:16px 14px;z-index:30;box-sizing:border-box}
header{display:contents}
.hrow{order:1;max-width:none;margin:0;padding:0 4px}.hmeta{order:2;max-width:none;margin:-8px 0 0;padding:0 4px}

.suite{gap:4px}.suite a,.suite span,.suite button{font-size:11.5px;padding:2px 8px}

.filtbtn{display:none}

select,input{font-size:14px}
.flbl{margin:9px 2px 4px}
#macroChips{display:grid;grid-template-columns:1fr 1fr;gap:4px;overflow:visible;padding:0}

#metricChips{flex-wrap:wrap;overflow:visible}
nav{position:static;display:flex;flex-direction:column;gap:8px;background:none;border:none;padding:0}
.ng{padding:8px;border:1px solid rgba(79,156,255,.30)}.ng.all{border-color:rgba(245,182,66,.28)}
.ngl{text-align:left;font-size:10px;padding:2px 6px 6px}
.ngb{flex-direction:column;gap:2px}
nav button{text-align:left;padding:8px 10px;font-size:13.5px;border-radius:8px;color:#c9d3e3}

.ng.sel button.on{background:var(--accent);color:#04101f}.ng.all button.on{background:var(--warn);color:#1a1204}
.wrap{max-width:var(--maxw);padding:18px 24px 48px}
.vhead{margin:0 0 12px;padding:14px 16px}
.vtit{font-size:19px}

<body>
<div class="side">
<header>
  <div class="suite" role="navigation" aria-label="Suite My Way"><a href="https://myway-corrado.vercel.app">My Way</a><a href="https://magut.vercel.app">Portafogli</a><span aria-current="page">Fondi</span><a href="https://etf-monitor-italia.vercel.app">ETF</a><button type="button" id="clienti">Clienti</button></div>
  <div class="hrow"><h1><b>OICR</b> Monitor</h1><button id="infoBtn" class="infob" aria-label="Info">i</button></div>
  <div class="hmeta"><div class="sub" id="cnt"></div></div>

  <div class="ng all"><div class="ngl">Dove posizionarsi</div><div class="ngb"><button data-tab="cat">Categorie</button><button data-tab="mappa">Mappa</button><button data-tab="idee">Idee</button></div></div>

<a id="etfLink" href="https://etf-monitor-italia.vercel.app" class="swapf" style="position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));right:14px;z-index:50;background:#1e293b;color:#e2e8f0;padding:8px 12px;border-radius:20px;font-size:12px;text-decoration:none;border:1px solid #334155">⇄ ETF</a>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<script>
let DATA,F,CATS,MO,META,SER,macroCounts={};
const I={isin:0,name:1,cat:2,macro:3,ytd:4,m1:5,m3:6,m6:7,r1:8,r3:9,r5:10,star:11,sd:12,oc:13,mom:14,nc:15,w1:16,mom2:17,mom3:18,drank:19,cons:20,ocq:21,sec:22,ir12:23,ir36:24,ir60:25,te:26,alpha:27,mdd:28,aum:29,bm:30};
const MOMS=[[14,'Mom. rel.'],[17,'Mom. 12-1'],[18,'Mom. accel.']];
const MOMDESC={14:'eccesso su 3-6 mesi vs mediana di categoria, corretto per volatilità',17:'rendimento 12 mesi escluso l\'ultimo mese',18:'accelerazione: 1 mese e 3m annualizzato vs 6m annualizzato, vs categoria'};
const METRICS=[['1 sett.',16],['1 mese',5],['3 mesi',6],['YTD',4],['1 anno',8],['3 anni p.a.',9],['5 anni p.a.',10],['🔥 Mom. rel.',14],['🔥 Mom. 12-1',17],['🔥 Mom. accel.',18],['🎯 Consistenza',20],['📐 IR 3 anni',24],['📐 IR 1 anno',23]];
const IRM=[23,24,25];
function aggiungiDeltaRango(){if(META&&META.prevDate&&!METRICS.some(m=>m[1]===19))METRICS.push(['⚡ Δ rango',19]);}
let state={metric:8,macro:null,cat:null,q:'',tab:'rank',catSort:'val'};
const isMom=()=>state.metric===14||state.metric===17||state.metric===18||state.metric===19||state.metric===20;
const mLabel=()=>METRICS.find(m=>m[1]===state.metric)[0];

/* META.date e' il momento in cui e' stata fatta la chiamata, NON la chiusura
   dei prezzi: l'app diceva "dati al 25/08" mostrando prezzi del 24. Finche' i
   dati erano incorporati nella pagina le due date coincidevano quasi sempre,
   perche' la build si faceva il giorno dopo la rilevazione; a dati vivi no.
   dataChiusura invece e' la moda di closePriceDate: la data vera dei prezzi. */
function dataDeiPrezzi(){
  const c=META.dataChiusura;
  if(c&&/^\d{4}-\d{2}-\d{2}$/.test(c)){const p=c.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
  return META.date||'—';
}
function scriviTestata(stato){
  // nTot, non nData: e' il numero di fondi nel monitor. I pochi senza nemmeno un
  // rendimento (12 su 3.818) restano nelle liste e nei filtri, quindi contarli e'
  // piu' onesto che scontarli dalla testata.
  const n=(META.nTot||META.nData||0).toLocaleString('it');
  const nota=stato==='copia'?' <span class="agg">· aggiorno…</span>'
    :stato==='copia-ferma'?' <span class="agg">· copia locale</span>':'';
  document.getElementById('cnt').innerHTML=n+' fondi'+nota+'<br><b class="asof">dati al '+dataDeiPrezzi()+'</b>';
}

const mc=document.getElementById('metricChips');
function buildMetricChips(){mc.innerHTML='';
  METRICS.forEach(([lbl,idx])=>{const c=document.createElement('div');
  c.className='chip'+(idx===14?' mom':'')+(idx===state.metric?' on':'');c.textContent=lbl;c.dataset.i=idx;
  c.onclick=()=>{state.metric=idx;[...mc.children].forEach(x=>x.classList.toggle('on',+x.dataset.i===idx));catCache={};render()};mc.appendChild(c);});}

function contaMacro(){macroCounts={};F.forEach(f=>{if(f[I.macro])macroCounts[f[I.macro]]=(macroCounts[f[I.macro]]||0)+1});}
const mch=document.getElementById('macroChips');
function buildMacroChips(){mch.innerHTML='';
  const all=document.createElement('div');all.className='chip'+(state.macro===null?' on':'');all.textContent='Tutti';
  all.onclick=()=>{state.macro=null;state.cat=null;buildMacroChips();buildCatSel();render()};mch.appendChild(all);
  MO.forEach(m=>{if(!macroCounts[m])return;const c=document.createElement('div');
    c.className='chip'+(state.macro===m?' on':'');c.textContent=m+' ('+macroCounts[m]+')';
    c.onclick=()=>{state.macro=(state.macro===m?null:m);state.cat=null;buildMacroChips();buildCatSel();render()};mch.appendChild(c);});}
const catSel=document.getElementById('catSel');
function buildCatSel(){const pool=F.filter(f=>f[I.cat]&&(!state.macro||f[I.macro]===state.macro));
  const cnts={};pool.forEach(f=>cnts[f[I.cat]]=(cnts[f[I.cat]]||0)+1);
  const list=Object.keys(cnts).sort((a,b)=>a.localeCompare(b,'it'));
  catSel.innerHTML='<option value="">'+(state.macro?('Tutte le categorie '+state.macro):'Tutte le categorie Morningstar')+'</option>'+
    list.map(c=>'<option value="'+c.replace(/"/g,'&quot;')+'">'+c+' ('+cnts[c]+')</option>').join('');catSel.value=state.cat||'';}
catSel.onchange=()=>{state.cat=catSel.value||null;render()};
document.getElementById('q').oninput=e=>{state.q=e.target.value.trim().toLowerCase();render()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render();});

const val=f=>f[state.metric];
function fmt(v){if(v===null||v===undefined)return'—';if(typeof state!=='undefined'&&IRM.includes(state.metric))return(v>0?'+':'')+v.toFixed(2);if(typeof state!=='undefined'&&state.metric===20)return v.toFixed(0)+'/5';if(typeof state!=='undefined'&&state.metric===19)return(v>0?'+':'')+v.toFixed(0)+' pt';return(v>0?'+':'')+v.toFixed(1)+'%'}
function cls(v){if(v===null||v===undefined)return'zero';if(typeof state!=='undefined'&&state.metric===20)return v>=4?'pos':(v<=1?'neg':'zero');return v>0.05?'pos':(v<-0.05?'neg':'zero')}
function stars(n){return n?'★'.repeat(n)+'☆'.repeat(5-n):''}
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function cmp(a,b){const d=(val(b)??-1e12)-(val(a)??-1e12);if(d)return d;
  if(state.metric===20){const m=(b[I.mom]??-1e9)-(a[I.mom]??-1e9);if(m)return m;
    const q=(a[I.ocq]??9)-(b[I.ocq]??9);if(q)return q;}
  return (a[I.name]||'').localeCompare(b[I.name]||'','it');}
function withData(l){return l.filter(f=>val(f)!==null&&val(f)!==undefined)}
function pool(){return F.filter(f=>{
  if(state.macro&&f[I.macro]!==state.macro)return false;
  if(state.cat&&f[I.cat]!==state.cat)return false;
  if(state.q){const s=(f[I.name]+' '+f[I.isin]+' '+(f[I.cat]||'')).toLowerCase();if(!s.includes(state.q))return false;}
  return true;});}
let catCache={};
function breadth(arr){let n=0,p=0;const d=[];
  arr.forEach(f=>{if(f[I.m1]!=null&&f[I.m3]!=null){n++;if(f[I.m1]>0&&f[I.m3]>0)p++;}if(f[I.m3]!=null)d.push(f[I.m3]);});
  d.sort((a,b)=>a-b);const q=x=>d[Math.min(d.length-1,Math.round(x*(d.length-1)))];
  return{b:n?Math.round(p/n*100):null,disp:d.length>3?+(q(.75)-q(.25)).toFixed(1):null,n:n};}
function bCls(b){return b==null?'zero':(b>=65?'pos':(b<=35?'neg':'zero'));}
function catRank(f){const key=f[I.cat]+'|'+state.metric;
  if(!catCache[key]){const a=F.filter(x=>x[I.cat]===f[I.cat]&&val(x)!=null).sort((x,y)=>val(y)-val(x));catCache[key]=a.map(x=>x[I.isin]);}
  const a=catCache[key];const i=a.indexOf(f[I.isin]);return i<0?null:{rank:i+1,n:a.length,q:Math.ceil((i+1)/a.length*4),
    score:a.length>1?Math.round((a.length-i-1)/(a.length-1)*100):50};}
function badges(f){let h='<div class="badges">';const r=f[I.cat]?catRank(f):null;
  if(isMom()&&r)h+='<span class="qbadge mbadge">Mom '+r.score+'/100</span>';
  if(r&&r.n>=5){if(r.q===1)h+='<span class="qbadge q1">Top cat. '+r.rank+'/'+r.n+'</span>';
    else if(r.q===4)h+='<span class="qbadge q4">Coda cat. '+r.rank+'/'+r.n+'</span>';}
  return h+'</div>';}
function rowCard(f,rank,rc){const v=val(f);
  return '<div class="card" onclick="detail(\''+f[I.isin]+'\')">'+(rank?'<div class="rank '+(rc||'')+'">'+rank+'</div>':'')+
    '<div class="info"><div class="nm">'+esc(f[I.name])+'</div><div class="ct">'+esc(f[I.cat]||'—')+'</div>'+badges(f)+'</div>'+
    '<div class="val"><div class="pct '+cls(v)+'">'+fmt(v)+'</div>'+(f[I.star]?'<div class="stars">'+stars(f[I.star])+'</div>':'')+'</div></div>';}

function viewRank(){const list=withData(pool()).sort(cmp);
  if(!list.length)return'<div class="empty">Nessun fondo con dati per questa selezione.</div>';
  let h='<div class="sec'+(isMom()?' hot':'')+'">'+(isMom()?'Classifica per '+mLabel():'Classifica per rendimento '+mLabel())+' · '+list.length+' fondi</div>';
  h+=list.slice(0,300).map((f,i)=>rowCard(f,i+1,i<3?'t':'')).join('');
  if(list.length>300)h+='<div class="empty">Mostrati i primi 300. Affina con filtri o ricerca.</div>';return h;}
function viewTopFlop(){const list=withData(pool()).sort(cmp);
  if(list.length<2)return'<div class="empty">Dati insufficienti.</div>';
  const n=Math.min(10,Math.floor(list.length/2)||1);
  const scope=state.cat?('cat. '+state.cat):(state.macro||'assoluto');
  const lbl=isMom()?'per '+mLabel():'per rend. '+mLabel();
  let h='<div class="sec top">▲ Migliori '+lbl+' — '+esc(scope)+'</div>'+list.slice(0,n).map((f,i)=>rowCard(f,i+1,'t')).join('');
  h+='<div class="sec flop">▼ Peggiori '+lbl+' — '+esc(scope)+'</div>';
  h+=list.slice(-n).reverse().map((f,i)=>rowCard(f,list.length-i,'b')).join('');return h;}

function median(a){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function viewCat(){const p=pool().filter(f=>f[I.cat]);const g={};p.forEach(f=>{(g[f[I.cat]]=g[f[I.cat]]||[]).push(f)});
  let keys=Object.keys(g);if(!keys.length)return'<div class="empty">Nessuna categoria.</div>';
  const stat=k=>{const v=withData(g[k]).map(val);return{n:g[k].length,nd:v.length,med:median(v)};};
  const S={};keys.forEach(k=>S[k]=stat(k));
  if(state.catSort==='val')keys.sort((a,b)=>((S[b].med??-1e9)-(S[a].med??-1e9)));
  else keys.sort((a,b)=>a.localeCompare(b,'it'));
  const valName=isMom()?mLabel():'rend. '+mLabel();
  let h='<div class="sec'+(isMom()?' hot':'')+'">'+keys.length+' categorie · mediana '+valName+'</div>';
  keys.forEach(k=>{const st=S[k];const gg=withData(g[k]).sort(cmp);
    h+='<div class="catcard"><div class="cathead" onclick="this.parentNode.classList.toggle(\'open\')">'+
      '<div class="cn">'+esc(k)+'</div><div class="cval"><div class="cv '+cls(st.med)+'">'+fmt(st.med)+'</div>'+
      '<div class="cmeta">'+st.n+' fondi</div></div></div>'+
      (function(){const bb=breadth(g[k]);return bb.b==null?'':'<div class="note" style="margin:0 10px 8px">Ampiezza: <b class="'+bCls(bb.b)+'">'+bb.b+'%</b> dei fondi con 1m e 3m positivi'+(bb.disp!=null?' · dispersione 3m '+bb.disp+' pt':'')+'</div>';})()+
      '<div class="catbody">'+
      (gg.length?'<div class="mlbl">▲ Migliore</div>'+miniRow(gg[0])+'<div class="mlbl">▼ Peggiore</div>'+miniRow(gg[gg.length-1])+
       (gg.length>2?'<div class="mlbl">Tutti ('+gg.length+')</div>'+gg.map(miniRow).join(''):''):'<div class="mlbl">Nessun dato</div>')+
      '</div></div>';});
  return h;}
function setSort(s){state.catSort=s;render();}
/* Bottoni di ordinamento: nella testata della vista (standard della suite, 01/10/2026). */
function sortRow(){const valName=isMom()?mLabel():'rend. '+mLabel();
  return '<div class="sortrow"><span class="vk">Ordina</span><button type="button" class="sc'+(state.catSort==='val'?' on':'')+'" onclick="setSort(\'val\')">Per '+valName+' ▼</button>'+
    '<button type="button" class="sc'+(state.catSort==='az'?' on':'')+'" onclick="setSort(\'az\')">A-Z</button></div>';}
function miniRow(f){const v=val(f);return '<div class="mini" onclick="event.stopPropagation();detail(\''+f[I.isin]+'\')"><div class="mn">'+esc(f[I.name])+'</div><div class="pct '+cls(v)+'" style="font-size:13px">'+fmt(v)+'</div></div>';}

function viewIdee(){const metricLbl=isMom()?mLabel():'rend. '+mLabel();
  let h='<div class="note" style="margin:12px 4px">Spunti sui fondi con dati Morningstar, per '+metricLbl+'. Filtra per macro nei filtri per restringere.</div>';
  const macros=state.macro?[state.macro]:MO.filter(m=>macroCounts[m]);
  // categorie in salita (per momentum/metrica)
  if(!state.cat){const p=F.filter(f=>f[I.cat]&&(!state.macro||f[I.macro]===state.macro)&&val(f)!=null);
    const g={};p.forEach(f=>{(g[f[I.cat]]=g[f[I.cat]]||[]).push(val(f))});
    const rows=Object.keys(g).filter(k=>g[k].length>=3).map(k=>[k,median(g[k]),g[k].length]).sort((a,b)=>b[1]-a[1]);
    if(rows.length){h+='<div class="sec hot">Categorie più in salita ('+metricLbl+')</div>';
      rows.slice(0,6).forEach(r=>{h+='<div class="card" onclick="pickCat(\''+r[0].replace(/\\/g,"\\\\").replace(/'/g,"\\'")+'\')"><div class="info"><div class="nm">'+esc(r[0])+'</div><div class="ct">'+r[2]+' fondi</div></div><div class="val"><div class="pct '+cls(r[1])+'">'+fmt(r[1])+'</div></div></div>';});}}
  macros.forEach(m=>{const g=withData(F.filter(f=>f[I.macro]===m&&(!state.q||(f[I.name]+' '+f[I.isin]).toLowerCase().includes(state.q)))).sort(cmp);
    if(!g.length)return;h+='<div class="sec top">'+m+' — migliori per '+metricLbl+'</div>'+g.slice(0,5).map((f,i)=>rowCard(f,i+1,'t')).join('');
    const qual=g.filter(f=>{const r=catRank(f);return f[I.star]>=4&&r&&r.q===1}).slice(0,5);
    if(qual.length){h+='<div class="sec">'+m+' — qualità (≥4★ e top quartile categoria)</div>'+qual.map(f=>rowCard(f,null)).join('');}});
  return h;}
function pickCat(c){state.cat=c;state.tab='cat';document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='cat'));buildCatSel();render();}

function viewMappa(){const p=pool().filter(f=>f[I.cat]&&val(f)!=null);
  const g={};p.forEach(f=>{(g[f[I.cat]]=g[f[I.cat]]||[]).push(f)});
  let keys=Object.keys(g);if(!keys.length)return'<div class="empty">Nessun dato per questa selezione.</div>';
  const stat={};keys.forEach(k=>{const bb=breadth(g[k]);stat[k]={med:median(g[k].map(val)),n:g[k].length,macro:g[k][0][I.macro],brd:bb.b,disp:bb.disp};});
  keys.sort((a,b)=>stat[b].med-stat[a].med);
  const mx=Math.max(1,...keys.map(k=>Math.abs(stat[k].med)));
  const valName=isMom()?mLabel():'rend. '+mLabel();
  const MC={Azionari:'#4f9cff',Obbligazionari:'#22c55e',Convertibili:'#14b8a6',Bilanciati:'#f5b642',Flessibili:'#a78bfa',Monetari:'#38bdf8',Alternativi:'#fb7185',Altro:'#94a3b8'};
  let h='<div class="sec'+(isMom()?' hot':'')+'">Mappa '+valName+' · '+keys.length+' categorie</div>'+
    '<div class="note" style="margin:0 4px 8px">Barra = mediana della categoria (verde &gt;0, rosso &lt;0), ordinata dalla più in salita. Il <b>% ↑</b> accanto al numero di fondi è l\'<b>ampiezza</b>: quota di fondi della categoria con 1 mese <b>e</b> 3 mesi positivi — sale prima della mediana quando una categoria sta girando. Tocca per aprire.</div>';
  keys.forEach(k=>{const s=stat[k],v=s.med,w=Math.abs(v)/mx*50,pos=v>=0;
    h+='<div class="maprow" onclick="pickCat(\''+k.replace(/\\/g,"\\\\").replace(/'/g,"\\'")+'\')">'+
      '<div class="mlbl2" style="border-left:3px solid '+(MC[s.macro]||"#888")+'"><span class="cn2">'+esc(k)+'</span> <small>('+s.n+')</small></div>'+
      '<div class="mbarwrap"><div class="mzero"></div><div class="mbar '+(pos?'mp':'mn')+'" style="'+(pos?'left:50%;width:'+w+'%':'right:50%;width:'+w+'%')+'"></div></div>'+
      '<div class="mval2 '+cls(v)+'">'+fmt(v)+(s.brd!=null?'<small style="display:block;font-weight:600;font-size:10px" class="'+bCls(s.brd)+'">'+s.brd+'% ↑</small>':'')+'</div></div>';});
  return h;}
const MESI=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
// "giu 2026" da "2026-06-30": le serie sono mensili, il giorno non aggiunge nulla
function fineSerie(){
  const c=META&&META.serieFine;
  if(!c||!/^\d{4}-\d{2}/.test(c))return null;
  const p=c.split('-');
  return MESI[+p[1]-1]+' '+p[0];
}
function svgLine(vals,up,srcLabel,leftLabel,rightLabel){
  const W=320,H=100,pad=6,N=vals.length;
  let mn=Math.min(...vals),mx=Math.max(...vals);if(mn===mx){mn-=1;mx+=1;}const rng=mx-mn;
  const X=i=>pad+(N<2?0:i/(N-1))*(W-2*pad);
  const Y=v=>pad+(1-(v-mn)/rng)*(H-2*pad);
  const pts=vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  const col=up?'#22c55e':'#f4536b';const y100=Y(100);
  const area=pts+' '+X(N-1).toFixed(1)+','+(H-pad)+' '+X(0).toFixed(1)+','+(H-pad);
  return '<div class="chartbox"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
    '<polygon points="'+area+'" fill="'+col+'" opacity="0.08"/>'+
    (100>=mn&&100<=mx?'<line x1="'+pad+'" y1="'+y100.toFixed(1)+'" x2="'+(W-pad)+'" y2="'+y100.toFixed(1)+'" stroke="#2b3a57" stroke-width="1" stroke-dasharray="3 3"/>':'')+
    '<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>'+
    '<div class="chleg"><span>'+leftLabel+'</span><span>'+srcLabel+'</span><span>'+(rightLabel||'oggi')+'</span></div></div>';
}
function growthChart(f){
  // storico reale se disponibile
  const raw=SER[f[I.isin]];
  if(raw){ const cum=raw.split(',').map(Number).filter(x=>isFinite(x));
    if(cum.length>=6){ const vals=cum.map(v=>100*(1+v/100)); const up=vals[vals.length-1]>=vals[0];
      const mo=cum.length-1; const left=mo>=60?'5 anni fa':mo>=36?'~3 anni fa':(mo+' mesi fa');
      return svgLine(vals,up,'storico Morningstar · base 100',left,fineSerie());
    }
  }
  const P=[];const push=(mo,val)=>{if(val!=null&&isFinite(val))P.push([mo,val]);};
  push(0,100);if(f[I.w1]!=null)push(0.25,100/(1+f[I.w1]/100));push(1,100/(1+f[I.m1]/100));push(3,100/(1+f[I.m3]/100));push(6,100/(1+f[I.m6]/100));
  if(f[I.ytd]!=null)push(6.7,100/(1+f[I.ytd]/100));
  push(12,100/(1+f[I.r1]/100));
  if(f[I.r3]!=null)push(36,100/Math.pow(1+f[I.r3]/100,3));
  if(f[I.r5]!=null)push(60,100/Math.pow(1+f[I.r5]/100,5));
  if(P.length<2)return'';
  P.sort((a,b)=>b[0]-a[0]); // dal più vecchio (mesi alti) a oggi
  const W=320,H=100,pad=6,maxMo=P[0][0];
  const vals=P.map(p=>p[1]);let mn=Math.min(...vals),mx=Math.max(...vals);if(mn===mx){mn-=1;mx+=1;}
  const rng=mx-mn;
  const X=mo=>pad+(1-mo/maxMo)*(W-2*pad);
  const Y=v=>pad+(1-(v-mn)/rng)*(H-2*pad);
  const pts=P.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');
  const up=P[P.length-1][1]>=P[0][1];const col=up?'#22c55e':'#f4536b';
  const y100=Y(100);
  const area='M'+X(P[0][0]).toFixed(1)+','+Y(P[0][0]).toFixed(1)+' '; // placeholder unused
  let marks=P.map(p=>'<circle cx="'+X(p[0]).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)+'" r="2.4" fill="'+col+'"/>').join('');
  const lbl=mo=>mo>=12?(mo/12)+'a':(mo+'m');
  return '<div class="chartbox"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
    '<line x1="'+pad+'" y1="'+y100.toFixed(1)+'" x2="'+(W-pad)+'" y2="'+y100.toFixed(1)+'" stroke="#2b3a57" stroke-width="1" stroke-dasharray="3 3"/>'+
    '<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+marks+'</svg>'+
    '<div class="chleg"><span>'+(maxMo>=60?'5 anni fa':maxMo>=36?'3 anni fa':(Math.round(maxMo)+' mesi fa'))+'</span><span>stima dai rendimenti · base 100</span><span>oggi</span></div></div>';
}

}

function cmpRemove(isin){CMP=CMP.filter(x=>x!==isin);cmpSave();cmpBar();if(CMP.length>=2)openCompare();else closeOv();}
function cmpPeriod(p){CMPP=p;openCompare();}

/* serie cumulata (% da inizio) -> array di valori indice, allineati alla fine */
function cmpSer(isin){const raw=SER[isin];if(!raw)return null;const c=raw.split(',').map(Number);if(c.length<7||c.some(x=>!isFinite(x)))return null;return c.map(v=>1+v/100);}
function cmpMonthLabel(back){ // etichetta del mese che sta "back" mesi prima della fine serie
  const c=META&&META.serieFine;if(!c)return back?back+' mesi fa':'fine';
  const p=c.split('-');let y=+p[0],m=+p[1]-1-back;while(m<0){m+=12;y--;}return MESI[m]+' '+String(y).slice(2);}
function cmpMedian(a){a=a.filter(x=>x!=null&&isFinite(x)).sort((x,y)=>x-y);if(!a.length)return null;const k=a.length>>1;return a.length%2?a[k]:(a[k-1]+a[k])/2;}
function cmpCorr(a,b){const n=a.length;if(n<12)return null;const ma=a.reduce((s,x)=>s+x,0)/n,mb=b.reduce((s,x)=>s+x,0)/n;
  let sab=0,saa=0,sbb=0;for(let i=0;i<n;i++){const da=a[i]-ma,db=b[i]-mb;sab+=da*db;saa+=da*da;sbb+=db*db;}
  return saa&&sbb?sab/Math.sqrt(saa*sbb):null;}

function cmpChart(fs){
  const withS=fs.map((f,i)=>({f,i,s:cmpSer(f[I.isin])})).filter(o=>o.s);
  const missing=fs.filter(f=>!cmpSer(f[I.isin]));
  if(!withS.length)return {html:'<div class="note">Nessuno di questi fondi ha lo storico mensile: il grafico non si può disegnare.</div>',n:0,ret:{}};
  const avail=Math.min(...withS.map(o=>o.s.length-1));
  const N=Math.min(CMPP,avail); // mesi effettivi
  const lines=withS.map(o=>{const s=o.s.slice(o.s.length-1-N);const b=s[0];return {i:o.i,f:o.f,v:s.map(x=>(x/b-1)*100),r:s.map((x,k)=>k?x/s[k-1]-1:null).slice(1)};});
  // mediana di categoria se i fondi con storico sono tutti della stessa categoria
  let med=null;const cats=[...new Set(withS.map(o=>o.f[I.cat]))];
  if(cats.length===1&&cats[0]){const peers=F.filter(x=>x[I.cat]===cats[0]).map(x=>cmpSer(x[I.isin])).filter(s=>s&&s.length-1>=N).map(s=>s.slice(s.length-1-N));
    if(peers.length>=5){med=[];for(let k=0;k<=N;k++)med.push(cmpMedian(peers.map(s=>(s[k]/s[0]-1)*100)));}}
  const all=lines.flatMap(l=>l.v).concat(med||[]);let mn=Math.min(0,...all),mx=Math.max(0,...all);if(mx-mn<2){mx+=1;mn-=1;}
  const W=Math.round(Math.max(300,Math.min(700,Math.min(760,window.innerWidth||360)-66))),H=W>500?230:190,L=36,R=8,T=8,B=20;
  const X=k=>L+(N?k/N:0)*(W-L-R), Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  const step=(mx-mn)>80?20:(mx-mn)>40?10:(mx-mn)>15?5:2;
  let g='';for(let t=Math.ceil(mn/step)*step;t<=mx;t+=step){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(t).toFixed(1)+'" y2="'+Y(t).toFixed(1)+'" stroke="'+(t===0?'#3a4c70':'#1f2b44')+'" stroke-width="1"'+(t===0?'':' stroke-dasharray="2 3"')+'/>'+
    '<text x="'+(L-4)+'" y="'+(Y(t)+3).toFixed(1)+'" text-anchor="end" font-size="10" fill="#93a1b8">'+(t>0?'+':'')+t+'%</text>';}
  const xt=[0,Math.round(N/2),N].filter((v,i,a)=>a.indexOf(v)===i).map(k=>'<text x="'+X(k).toFixed(1)+'" y="'+(H-5)+'" text-anchor="'+(k===0?'start':k===N?'end':'middle')+'" font-size="10" fill="#93a1b8">'+cmpMonthLabel(N-k)+'</text>').join('');
  const pl=(v,c,ex)=>'<polyline points="'+v.map((y,k)=>X(k).toFixed(1)+','+Y(y).toFixed(1)).join(' ')+'" fill="none" stroke="'+c+'" stroke-width="'+(ex||2)+'" stroke-linejoin="round" stroke-linecap="round"'+(ex?' stroke-dasharray="4 3" opacity=".8"':'')+'/>';
  const svg='<div class="chartbox cmpchart"><svg viewBox="0 0 '+W+' '+H+'">'+g+(med?pl(med,'#93a1b8',1.5):'')+lines.map(l=>pl(l.v,CMPCOL[l.i])).join('')+xt+'</svg></div>';
  const ret={};lines.forEach(l=>{ret[l.f[I.isin]]=l.v[l.v.length-1];});
  let leg='<div class="cmpleg">'+lines.map(l=>'<span><i style="background:'+CMPCOL[l.i]+'"></i>'+esc(cmpShort(l.f[I.name]))+' <b class="'+(l.v[N]>=0?'pos':'neg')+'">'+(l.v[N]>0?'+':'')+l.v[N].toFixed(1)+'%</b></span>').join('')+
    (med?'<span><i class="dash"></i>mediana categoria <b>'+(med[N]>0?'+':'')+med[N].toFixed(1)+'%</b></span>':'')+'</div>';
  let nt=[];
  if(N<CMPP)nt.push('Il fondo più giovane ha <b>'+avail+' mesi</b> di storico: tutte le linee partono da 0 a <b>'+cmpMonthLabel(N)+'</b>, così il confronto è alla pari.');
  if(missing.length)nt.push('Senza storico mensile, esclusi dal grafico e dalla correlazione: '+missing.map(f=>'<b>'+esc(cmpShort(f[I.name]))+'</b>').join(', ')+'.');
  return {html:svg+leg+(nt.length?'<div class="note">'+nt.join(' ')+'</div>':''),n:N,lines,ret};
}

function cmpTable(fs,ret){
  const P=v=>v==null?'—':(v>0?'+':'')+v.toFixed(1)+'%';
  const D=v=>v==null?'—':(v>0?'+':'')+v.toFixed(2);
  const rk=f=>{const r=f[I.cat]?catRank(f):null;return r?r.rank+'° / '+r.n:'—';};
  const MSTATE=f=>{const m3=f[I.m3],m6=f[I.m6];if(m3==null||m6==null)return null;const acc=4*m3-2*m6;return m6>=0?(acc>0?'🚀':'⚠️'):(acc>0?'↗️':'🔻');};
  // [etichetta, valore, formato, verso migliore (+1 alto, -1 basso, 0 nessuno)]
  const rows=[
    ['g','Rendimenti'],
    ['Nel grafico',f=>ret[f[I.isin]],P,1],
    ['1 mese',f=>f[I.m1],P,1],['3 mesi',f=>f[I.m3],P,1],['6 mesi',f=>f[I.m6],P,1],['YTD',f=>f[I.ytd],P,1],
    ['1 anno',f=>f[I.r1],P,1],['3 anni p.a.',f=>f[I.r3],P,1],['5 anni p.a.',f=>f[I.r5],P,1],
    ['g','Rischio'],
    ['Volatilità 3a',f=>f[I.sd],v=>v==null?'—':v.toFixed(1)+'%',-1],
    ['Max ribasso 3a',f=>f[I.mdd],P,1],
    ['Rend./rischio 3a',f=>f[I.r3]!=null&&f[I.sd]?f[I.r3]/f[I.sd]:null,D,1],
    ['Tracking error 3a',f=>f[I.te],v=>v==null?'—':v.toFixed(1)+'%',0],
    ['g','Qualità del gestore'],
    ['IR 1 anno',f=>f[I.ir12],D,1],['IR 3 anni',f=>f[I.ir36],D,1],['IR 5 anni',f=>f[I.ir60],D,1],
    ['Alpha 3a',f=>f[I.alpha],P,1],
    ['Consistenza',f=>f[I.cons],v=>v==null?'—':v+'/5',1],
    ['g','Momentum'],
    ['Mom. rel.',f=>f[14],P,1],['Mom. 12-1',f=>f[17],P,1],['Stato',f=>MSTATE(f),v=>v||'—',0],
    ['g','Costi e dati'],
    ['Costo (TER)',f=>f[I.oc],v=>v==null?'—':v.toFixed(2)+'%',-1],
    ['Quartile costo',f=>f[I.ocq],v=>v==null?'—':v+'°',-1],
    ['Rating',f=>f[I.star],v=>v?'<span style="color:var(--warn)">'+'★'.repeat(v)+'</span>':'—',1],
    ['Patrimonio',f=>f[I.aum],aumTxt,0],
    ['Rango in cat. ('+mLabel()+')',f=>rk(f),v=>v,0],
    ['Categoria',f=>f[I.cat]||'—',v=>'<span class="cmpcat">'+esc(v)+'</span>',0],
  ];
  let h='<div class="cmpwrap"><table class="cmptab"><thead><tr><th></th>'+fs.map((f,i)=>'<th><i style="background:'+CMPCOL[i]+'"></i><span onclick="detail(\''+f[I.isin]+'\')">'+esc(cmpShort(f[I.name]))+'</span><button class="cmprm" onclick="cmpRemove(\''+f[I.isin]+'\')" aria-label="Togli">✕</button></th>').join('')+'</tr></thead><tbody>';
  rows.forEach(r=>{
    if(r[0]==='g'){h+='<tr class="cmpg"><td colspan="'+(fs.length+1)+'">'+r[1]+'</td></tr>';return;}
    const vals=fs.map(r[1]);const nums=vals.filter(v=>typeof v==='number'&&isFinite(v));
    const best=r[3]&&nums.length>1&&new Set(nums).size>1?(r[3]>0?Math.max(...nums):Math.min(...nums)):null;
    h+='<tr><td>'+r[0]+'</td>'+vals.map(v=>{const isB=best!=null&&v===best;const c=typeof v==='number'&&r[2]===P?(v>0.05?'pos':v<-0.05?'neg':'zero'):'';return '<td class="'+c+(isB?' best':'')+'">'+r[2](v)+'</td>';}).join('')+'</tr>';
  });
  return h+'</tbody></table></div>';
}

function cmpCorrHtml(ch){
  const L=(ch.lines||[]);if(L.length<2)return '';
  if(ch.n<12)return '<div class="note">La correlazione serve almeno un anno di storico in comune: qui ce ne sono '+ch.n+' mesi.</div>';
  const C=v=>v==null?'':v>=0.8?'c4':v>=0.5?'c3':v>=0.2?'c2':'c1';
  let h='<div class="cmpwrap"><table class="cmptab cmpcorr"><thead><tr><th></th>'+L.map(l=>'<th><i style="background:'+CMPCOL[l.i]+'"></i></th>').join('')+'</tr></thead><tbody>';
  L.forEach((a,x)=>{h+='<tr><td><i class="dot" style="background:'+CMPCOL[a.i]+'"></i>'+esc(cmpShort(a.f[I.name]))+'</td>'+L.map((b,y)=>{if(x===y)return '<td class="zero">—</td>';const c=cmpCorr(a.r,b.r);return '<td class="'+C(c)+'">'+(c==null?'—':c.toFixed(2).replace('.',','))+'</td>';}).join('')+'</tr>';});
  h+='</tbody></table></div>';
  // la coppia più legata e la meno legata, in parole
  let hi=null,lo=null;for(let x=0;x<L.length;x++)for(let y=x+1;y<L.length;y++){const c=cmpCorr(L[x].r,L[y].r);if(c==null)continue;if(!hi||c>hi[0])hi=[c,x,y];if(!lo||c<lo[0])lo=[c,x,y];}
  const nm=k=>'<b>'+esc(cmpShort(L[k].f[I.name]))+'</b>';
  let s='';if(hi&&hi[0]>=0.8)s+='Si muovono quasi insieme '+nm(hi[1])+' e '+nm(hi[2])+' ('+hi[0].toFixed(2).replace('.',',')+'): tenerli entrambi diversifica poco. ';
  if(lo&&lo!==hi&&lo[0]<0.5)s+='La coppia più indipendente è '+nm(lo[1])+' e '+nm(lo[2])+' ('+lo[0].toFixed(2).replace('.',',')+'). ';
  return h+'<div class="note">'+s+'Calcolata sui rendimenti mensili degli ultimi '+ch.n+' mesi. <span class="c4 cl">≥0,8 quasi uguali</span> <span class="c3 cl">0,5–0,8 simili</span> <span class="c2 cl">0,2–0,5 diversi</span> <span class="c1 cl">&lt;0,2 indipendenti</span></div>';
}

function openCompare(){
  const fs=CMP.map(cmpFund).filter(Boolean);
  if(fs.length<2){alert('Aggiungi almeno 2 fondi al confronto dalla loro scheda.');return;}
  const ch=cmpChart(fs);
  const per=[[12,'1 anno'],[36,'3 anni'],[60,'5 anni']];
  let b='<button class="closex" onclick="closeOv()">✕</button><h2>Confronto fondi</h2>'+
    '<div class="mc">'+fs.length+' fondi · tocca un nome per aprirne la scheda, ✕ per toglierlo</div>'+
    '<div class="mlbl">Performance cumulata</div><div class="chips" style="margin-bottom:6px">'+per.map(p=>'<button class="chip'+(CMPP===p[0]?' on':'')+'" onclick="cmpPeriod('+p[0]+')">'+p[1]+'</button>').join('')+'</div>'+
    ch.html+
    '<div class="mlbl">Fianco a fianco <span class="cmpbest">in verde il migliore della riga</span></div>'+cmpTable(fs,ch.ret)+
    (ch.lines&&ch.lines.length>=2?'<div class="mlbl">Correlazione — si muovono insieme?</div>'+cmpCorrHtml(ch):'')+
    '<div class="note"><b>Come leggerlo.</b> Il grafico mostra quanto avrebbe reso ogni fondo dalla stessa data di partenza, in % e nella valuta della classe, con lo storico mensile Morningstar fino a <b>'+(fineSerie()||'n/d')+'</b>: i rendimenti in tabella sono invece aggiornati al '+dataDeiPrezzi()+'. '+
    'Quando i fondi sono tutti della stessa categoria compare la <b>mediana della categoria</b> (tratteggiata). In tabella il verde segna il valore migliore di ogni riga: per volatilità e costo vince il più basso. '+
    'La <b>correlazione</b> va da −1 a +1: vicino a 1 i fondi salgono e scendono insieme, vicino a 0 si muovono in modo indipendente. Per un portafoglio, due fondi molto correlati sono quasi un doppione. '+
    'Fondi di categorie diverse si confrontano solo con cautela: un azionario e un obbligazionario hanno rischi diversi. Informativa, non sollecitazione all\'investimento; le performance passate non sono indicative di quelle future.</div>';
  document.getElementById('sheet').innerHTML=b;document.getElementById('ov').classList.add('on');
  const sh=document.getElementById('sheet');sh.scrollTop=0;
}
window.cmpToggle=cmpToggle;window.cmpClear=cmpClear;window.cmpRemove=cmpRemove;window.cmpPeriod=cmpPeriod;window.openCompare=openCompare;

function boot(d,stato){
  DATA=d; F=d.funds||[]; CATS=d.cats||[]; MO=d.macroOrder||[]; META=d.meta||{}; SER=d.series||{};
  window.__DATA_META=META;                  // serve solo a tools/test_pagina.js
  catCache={};
  aggiungiDeltaRango();
  scriviTestata(stato);
  contaMacro();
  buildMetricChips(); buildMacroChips(); buildCatSel(); render(); cmpBar();
}
// le chiamate arrivano dagli onclick nell'HTML: devono restare globali
window.detail=detail; window.closeOv=closeOv; window.setSort=setSort; window.pickCat=pickCat;
window.__boot=boot; window.__testata=scriviTestata;

/* Caricamento dei dati — METODOLOGIA.md §1.
   Due sorgenti, chieste insieme e non in cascata:
     - data/bootstrap.json, statico e servito dalla CDN, per avere qualcosa sullo
       schermo subito. E' l'ultima fotografia buona, gia' in schema 2 e gia'
       deduplicata: la genera tools/build_bootstrap.js con lo stesso codice di
       api/data.js, quindi non esiste una seconda regola che possa divergere.
     - /api/data, che prende il posto della copia appena risponde.
   Le due risposte arrivano in ordine imprevedibile — un /api/data che fallisce
   subito puo' benissimo precedere una copia da 1,5 MB — quindi qui non si
   disegna "quando arriva qualcosa": ogni esito aggiorna lo stato, e lo stato
   decide cosa mostrare. La schermata d'errore appare solo quando SONO FALLITE
   TUTTE E DUE. */
(function(){
  var fresco=false, disegnato=false, refreshKO=false;

  function vuoto(d){ return !d || !d.funds || !d.funds.length; }

  function mostra(d,stato){
    if(fresco) return;                          // i dati freschi non si sovrascrivono
    if(stato==='fresco') fresco=true;
    disegnato=true;
    try{ window.__boot(d,stato); }catch(e){ console.error('boot',e); }
  }

  function errore(){
    document.getElementById('view').innerHTML=
      '<div class="empty">Non riesco a caricare i dati.<br><br>'+
      '<button class="chip on" onclick="location.reload()">Riprova</button></div>';
    document.getElementById('cnt').innerHTML='<b class="asof">dati non disponibili</b>';
  }

  var pCopia=fetch('data/bootstrap.json',{cache:'force-cache'})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){ if(vuoto(d)) throw 0; return d; })
    .catch(function(){ return null; });

  var pFresco=fetch('/api/data')
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){ if(vuoto(d)) throw new Error('risposta senza fondi'); return d; })
    .catch(function(){ return null; });

  pCopia.then(function(d){
    if(d) mostra(d, refreshKO ? 'copia-ferma' : 'copia');
  });

  pFresco.then(function(d){
    if(d){ mostra(d,'fresco'); return; }
    refreshKO=true;
    // se la copia sta gia' reggendo, smetti di promettere un aggiornamento
    if(disegnato){ try{ window.__testata('copia-ferma'); }catch(_){ } }
  });

  Promise.all([pCopia,pFresco]).then(function(){ if(!disegnato) errore(); });
})();

</script>
