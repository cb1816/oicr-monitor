<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="OICR">
<link rel="apple-touch-icon" sizes="180x180" href="icon-oicr-v2.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>OICR Monitor</title>
<style>
:root{--bg:#0b1220;--panel:#131c2e;--panel2:#1b2942;--line:#25324d;--txt:#e8edf6;--mut:#93a1b8;
  --accent:#4f9cff;--pos:#22c55e;--neg:#f4536b;--warn:#f5b642;--chip:#1e2c46;--hot:#ff7a45}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4}
.wrap{max-width:760px;margin:0 auto;padding:0 12px 96px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0b1220 72%,rgba(11,18,32,.92));padding:calc(12px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line)}
.hrow{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:18px;margin:0}h1 b{color:var(--accent)}
.sub{font-size:11.5px;color:var(--mut);margin-top:2px;text-align:right;line-height:1.3;white-space:nowrap}
.sub .asof{color:var(--txt);font-weight:600}
.infob{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--chip);border:1px solid var(--line);color:var(--accent);font-weight:800;font-style:italic;font-family:Georgia,serif;font-size:15px;line-height:1;cursor:pointer;padding:0}
.ihead{font-size:12.5px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 5px}
.ihead.hot{color:var(--hot)}
.ibox{background:rgba(255,122,69,.10);border:1px solid rgba(255,122,69,.35);border-radius:10px;padding:11px 13px;margin-top:4px}
.ip{font-size:12.5px;color:var(--txt);line-height:1.5;margin:0 0 7px}
.ip b{color:#fff}
.istep{display:flex;gap:9px;margin:8px 0;font-size:12.5px;line-height:1.45}
.istep .n{flex:0 0 20px;height:20px;border-radius:50%;background:var(--hot);color:#1a0d06;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center}
.controls{max-width:760px;margin:8px auto 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--chip);color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:#04101f;border-color:var(--accent)}
.chip.mom.on{background:var(--hot);color:#1a0d06;border-color:var(--hot)}
.row2{display:flex;gap:6px;margin-top:6px}
select,input{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px;width:100%;font-family:inherit}
select{flex:1;min-width:0}
.searchw{position:relative;flex:1}.searchw input{padding-left:32px}
.searchw::before{content:"🔎";position:absolute;left:9px;top:8px;font-size:14px;opacity:.6}
nav{position:fixed;bottom:0;left:0;right:0;background:#0d1626;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:var(--mut);padding:9px 4px 8px;font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .ic{font-size:18px;line-height:1}
nav button.on{color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer}
.card:active{background:var(--panel2)}
.rank{flex:0 0 30px;text-align:center;font-weight:800;font-size:15px;color:var(--mut)}
.rank.t{color:var(--pos)}.rank.b{color:var(--neg)}
.info{flex:1;min-width:0}
.nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.val{flex:0 0 auto;text-align:right;min-width:66px}
.pct{font-size:16px;font-weight:800}
.pos{color:var(--pos)}.neg{color:var(--neg)}.zero{color:var(--mut)}
.stars{font-size:10px;color:var(--warn);margin-top:1px;letter-spacing:1px}
.badges{margin-top:2px;display:flex;gap:4px;flex-wrap:wrap}
.qbadge{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:5px}
.q1{background:rgba(34,197,94,.16);color:var(--pos)}.q4{background:rgba(244,83,107,.16);color:var(--neg)}
.mbadge{background:rgba(255,122,69,.18);color:var(--hot)}
.sec{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:16px 4px 6px}
.sec.flop{color:var(--neg)}.sec.top{color:var(--pos)}.sec.hot{color:var(--hot)}
.empty{color:var(--mut);text-align:center;padding:40px 10px;font-size:13px}
.catcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.cathead{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer}
.cathead .cn{flex:1;font-size:13.5px;font-weight:700;min-width:0}
.cathead .cval{text-align:right;flex:0 0 auto}
.cathead .cv{font-size:15px;font-weight:800}
.cathead .cmeta{font-size:10.5px;color:var(--mut)}
.catbody{border-top:1px solid var(--line);padding:4px 12px 8px;display:none}
.catcard.open .catbody{display:block}
.mini{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:12.5px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer}
.mini:last-child{border-bottom:none}.mini .mn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlbl{font-size:10px;color:var(--mut);margin:6px 0 2px;text-transform:uppercase;letter-spacing:.5px}
.sortrow{display:flex;gap:6px;margin:10px 4px 4px}
.sortrow .sc{font-size:11.5px;font-weight:700;color:var(--mut);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
.sortrow .sc.on{background:var(--panel2);color:var(--txt);border-color:var(--accent)}
.ov{position:fixed;inset:0;background:rgba(4,8,16,.7);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--panel);width:100%;max-width:760px;border-radius:16px 16px 0 0;border-top:1px solid var(--line);max-height:88vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{font-size:16px;margin:0 6px 2px 0}.sheet .mc{font-size:12px;color:var(--mut);margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid.g2{grid-template-columns:1fr 1fr}
.kv{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.kv .k{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.kv .v{font-size:16px;font-weight:800;margin-top:2px}.kv .v.sm{font-size:13px}
.closex{float:right;background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer}
.note{font-size:11px;color:var(--mut);margin-top:10px;line-height:1.5}
.pill{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:11px;color:var(--mut);margin:0 5px 4px 0}
.mombar{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:6px}
.mombar>i{display:block;height:100%;background:linear-gradient(90deg,#f4536b,#f5b642,#22c55e)}
.chartbox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 8px 4px;margin-top:4px}
.chartbox svg{display:block;width:100%;height:110px}
.chleg{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);padding:2px 4px 0}
.maprow{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
.maprow:active{background:var(--panel2)}
.mlbl2{flex:0 0 42%;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:7px}
.mlbl2 .cn2{color:var(--txt)}.mlbl2 small{color:var(--mut)}
.mval2{flex:0 0 54px;text-align:right;font-size:12.5px;font-weight:800}
.mbarwrap{position:relative;flex:1;height:15px}
.mzero{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.mbar{position:absolute;top:3px;height:9px;border-radius:2px}
.mbar.mp{background:var(--pos)}.mbar.mn{background:var(--neg)}
.agg{color:var(--warn);font-weight:600}
.msLink{display:inline-block;margin-top:6px;font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1><b>OICR</b> Monitor</h1><div style="display:flex;align-items:center;gap:8px"><div class="sub" id="cnt"></div><button id="infoBtn" class="infob" aria-label="Info">i</button></div></div>
  <div class="controls">
    <div class="chips" id="metricChips"></div>
    <div class="chips" id="macroChips" style="margin-top:6px"></div>
    <div class="row2"><select id="catSel"></select></div>
    <div class="row2"><div class="searchw"><input id="q" placeholder="Cerca fondo o ISIN…" autocomplete="off"></div></div>
  </div>
</header>
<div class="wrap"><div id="view"></div></div>
<nav>
  <button data-tab="rank" class="on"><span class="ic">📊</span>Classifica</button>
  <button data-tab="topflop"><span class="ic">🏆</span>Top / Flop</button>
  <button data-tab="cat"><span class="ic">🗂️</span>Categorie</button>
  <button data-tab="mappa"><span class="ic">🗺️</span>Mappa</button>
  <button data-tab="idee"><span class="ic">💡</span>Idee</button>
</nav>
<a href="https://etf-monitor-italia.vercel.app" style="position:fixed;bottom:calc(64px + env(safe-area-inset-bottom));right:14px;z-index:50;background:#1e293b;color:#e2e8f0;padding:8px 12px;border-radius:20px;font-size:12px;text-decoration:none;border:1px solid #334155">⇄ ETF</a>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<script>
let DATA,F,CATS,MO,META,SER,macroCounts={};
const I={isin:0,name:1,cat:2,macro:3,ytd:4,m1:5,m3:6,m6:7,r1:8,r3:9,r5:10,star:11,sd:12,oc:13,mom:14,nc:15,w1:16,mom2:17,mom3:18,drank:19,cons:20,ocq:21,sec:22};
const MOMS=[[14,'Mom. rel.'],[17,'Mom. 12-1'],[18,'Mom. accel.']];
const MOMDESC={14:'eccesso su 3-6 mesi vs mediana di categoria, corretto per volatilità',17:'rendimento 12 mesi escluso l\'ultimo mese',18:'accelerazione: 1 mese e 3m annualizzato vs 6m annualizzato, vs categoria'};
const METRICS=[['1 sett.',16],['1 mese',5],['3 mesi',6],['YTD',4],['1 anno',8],['3 anni p.a.',9],['5 anni p.a.',10],['🔥 Mom. rel.',14],['🔥 Mom. 12-1',17],['🔥 Mom. accel.',18],['🎯 Consistenza',20]];
function aggiungiDeltaRango(){if(META&&META.prevDate&&!METRICS.some(m=>m[1]===19))METRICS.push(['⚡ Δ rango',19]);}
let state={metric:8,macro:null,cat:null,q:'',tab:'rank',catSort:'val'};
const isMom=()=>state.metric===14||state.metric===17||state.metric===18||state.metric===19||state.metric===20;
const mLabel=()=>METRICS.find(m=>m[1]===state.metric)[0];

/* META.date e' il momento in cui e' stata fatta la chiamata, NON la chiusura
   dei prezzi: l'app diceva "dati al 25/08" mostrando prezzi del 24. Finche' i
   dati erano incorporati nella pagina le due date coincidevano quasi sempre,
   perche' la build si faceva il giorno dopo la rilevazione; a dati vivi no.
   dataChiusura invece e' la moda di closePriceDate: la data vera dei prezzi. */
function dataDeiPrezzi(){
  const c=META.dataChiusura;
  if(c&&/^\d{4}-\d{2}-\d{2}$/.test(c)){const p=c.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
  return META.date||'—';
}
function scriviTestata(stato){
  // nTot, non nData: e' il numero di fondi nel monitor. I pochi senza nemmeno un
  // rendimento (12 su 3.818) restano nelle liste e nei filtri, quindi contarli e'
  // piu' onesto che scontarli dalla testata.
  const n=(META.nTot||META.nData||0).toLocaleString('it');
  const nota=stato==='copia'?' <span class="agg">· aggiorno…</span>'
    :stato==='copia-ferma'?' <span class="agg">· copia locale</span>':'';
  document.getElementById('cnt').innerHTML=n+' fondi'+nota+'<br><b class="asof">dati al '+dataDeiPrezzi()+'</b>';
}

const mc=document.getElementById('metricChips');
function buildMetricChips(){mc.innerHTML='';
  METRICS.forEach(([lbl,idx])=>{const c=document.createElement('div');
  c.className='chip'+(idx===14?' mom':'')+(idx===state.metric?' on':'');c.textContent=lbl;c.dataset.i=idx;
  c.onclick=()=>{state.metric=idx;[...mc.children].forEach(x=>x.classList.toggle('on',+x.dataset.i===idx));catCache={};render()};mc.appendChild(c);});}

function contaMacro(){macroCounts={};F.forEach(f=>{if(f[I.macro])macroCounts[f[I.macro]]=(macroCounts[f[I.macro]]||0)+1});}
const mch=document.getElementById('macroChips');
function buildMacroChips(){mch.innerHTML='';
  const all=document.createElement('div');all.className='chip'+(state.macro===null?' on':'');all.textContent='Tutti';
  all.onclick=()=>{state.macro=null;state.cat=null;buildMacroChips();buildCatSel();render()};mch.appendChild(all);
  MO.forEach(m=>{if(!macroCounts[m])return;const c=document.createElement('div');
    c.className='chip'+(state.macro===m?' on':'');c.textContent=m+' ('+macroCounts[m]+')';
    c.onclick=()=>{state.macro=(state.macro===m?null:m);state.cat=null;buildMacroChips();buildCatSel();render()};mch.appendChild(c);});}
const catSel=document.getElementById('catSel');
function buildCatSel(){const pool=F.filter(f=>f[I.cat]&&(!state.macro||f[I.macro]===state.macro));
  const cnts={};pool.forEach(f=>cnts[f[I.cat]]=(cnts[f[I.cat]]||0)+1);
  const list=Object.keys(cnts).sort((a,b)=>a.localeCompare(b,'it'));
  catSel.innerHTML='<option value="">'+(state.macro?('Tutte le categorie '+state.macro):'Tutte le categorie Morningstar')+'</option>'+
    list.map(c=>'<option value="'+c.replace(/"/g,'&quot;')+'">'+c+' ('+cnts[c]+')</option>').join('');catSel.value=state.cat||'';}
catSel.onchange=()=>{state.cat=catSel.value||null;render()};
document.getElementById('q').oninput=e=>{state.q=e.target.value.trim().toLowerCase();render()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render();});

const val=f=>f[state.metric];
function fmt(v){if(v===null||v===undefined)return'—';if(typeof state!=='undefined'&&state.metric===20)return v.toFixed(0)+'/5';if(typeof state!=='undefined'&&state.metric===19)return(v>0?'+':'')+v.toFixed(0)+' pt';return(v>0?'+':'')+v.toFixed(1)+'%'}
function cls(v){if(v===null||v===undefined)return'zero';if(typeof state!=='undefined'&&state.metric===20)return v>=4?'pos':(v<=1?'neg':'zero');return v>0.05?'pos':(v<-0.05?'neg':'zero')}
function stars(n){return n?'★'.repeat(n)+'☆'.repeat(5-n):''}
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function cmp(a,b){const d=(val(b)??-1e12)-(val(a)??-1e12);if(d)return d;
  if(state.metric===20){const m=(b[I.mom]??-1e9)-(a[I.mom]??-1e9);if(m)return m;
    const q=(a[I.ocq]??9)-(b[I.ocq]??9);if(q)return q;}
  return (a[I.name]||'').localeCompare(b[I.name]||'','it');}
function withData(l){return l.filter(f=>val(f)!==null&&val(f)!==undefined)}
function pool(){return F.filter(f=>{
  if(state.macro&&f[I.macro]!==state.macro)return false;
  if(state.cat&&f[I.cat]!==state.cat)return false;
  if(state.q){const s=(f[I.name]+' '+f[I.isin]+' '+(f[I.cat]||'')).toLowerCase();if(!s.includes(state.q))return false;}
  return true;});}
let catCache={};
function breadth(arr){let n=0,p=0;const d=[];
  arr.forEach(f=>{if(f[I.m1]!=null&&f[I.m3]!=null){n++;if(f[I.m1]>0&&f[I.m3]>0)p++;}if(f[I.m3]!=null)d.push(f[I.m3]);});
  d.sort((a,b)=>a-b);const q=x=>d[Math.min(d.length-1,Math.round(x*(d.length-1)))];
  return{b:n?Math.round(p/n*100):null,disp:d.length>3?+(q(.75)-q(.25)).toFixed(1):null,n:n};}
function bCls(b){return b==null?'zero':(b>=65?'pos':(b<=35?'neg':'zero'));}
function catRank(f){const key=f[I.cat]+'|'+state.metric;
  if(!catCache[key]){const a=F.filter(x=>x[I.cat]===f[I.cat]&&val(x)!=null).sort((x,y)=>val(y)-val(x));catCache[key]=a.map(x=>x[I.isin]);}
  const a=catCache[key];const i=a.indexOf(f[I.isin]);return i<0?null:{rank:i+1,n:a.length,q:Math.ceil((i+1)/a.length*4),
    score:a.length>1?Math.round((a.length-i-1)/(a.length-1)*100):50};}
function badges(f){let h='<div class="badges">';const r=f[I.cat]?catRank(f):null;
  if(isMom()&&r)h+='<span class="qbadge mbadge">Mom '+r.score+'/100</span>';
  if(r&&r.n>=5){if(r.q===1)h+='<span class="qbadge q1">Top cat. '+r.rank+'/'+r.n+'</span>';
    else if(r.q===4)h+='<span class="qbadge q4">Coda cat. '+r.rank+'/'+r.n+'</span>';}
  return h+'</div>';}
function rowCard(f,rank,rc){const v=val(f);
  return '<div class="card" onclick="detail(\''+f[I.isin]+'\')">'+(rank?'<div class="rank '+(rc||'')+'">'+rank+'</div>':'')+
    '<div class="info"><div class="nm">'+esc(f[I.name])+'</div><div class="ct">'+esc(f[I.cat]||'—')+'</div>'+badges(f)+'</div>'+
    '<div class="val"><div class="pct '+cls(v)+'">'+fmt(v)+'</div>'+(f[I.star]?'<div class="stars">'+stars(f[I.star])+'</div>':'')+'</div></div>';}

function viewRank(){const list=withData(pool()).sort(cmp);
  if(!list.length)return'<div class="empty">Nessun fondo con dati per questa selezione.</div>';
  let h='<div class="sec'+(isMom()?' hot':'')+'">'+(isMom()?'Classifica per '+mLabel():'Classifica per rendimento '+mLabel())+' · '+list.length+' fondi</div>';
  h+=list.slice(0,300).map((f,i)=>rowCard(f,i+1,i<3?'t':'')).join('');
  if(list.length>300)h+='<div class="empty">Mostrati i primi 300. Affina con filtri o ricerca.</div>';return h;}
function viewTopFlop(){const list=withData(pool()).sort(cmp);
  if(list.length<2)return'<div class="empty">Dati insufficienti.</div>';
  const n=Math.min(10,Math.floor(list.length/2)||1);
  const scope=state.cat?('cat. '+state.cat):(state.macro||'assoluto');
  const lbl=isMom()?'per '+mLabel():'per rend. '+mLabel();
  let h='<div class="sec top">▲ Migliori '+lbl+' — '+esc(scope)+'</div>'+list.slice(0,n).map((f,i)=>rowCard(f,i+1,'t')).join('');
  h+='<div class="sec flop">▼ Peggiori '+lbl+' — '+esc(scope)+'</div>';
  h+=list.slice(-n).reverse().map((f,i)=>rowCard(f,list.length-i,'b')).join('');return h;}

function median(a){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function viewCat(){const p=pool().filter(f=>f[I.cat]);const g={};p.forEach(f=>{(g[f[I.cat]]=g[f[I.cat]]||[]).push(f)});
  let keys=Object.keys(g);if(!keys.length)return'<div class="empty">Nessuna categoria.</div>';
  const stat=k=>{const v=withData(g[k]).map(val);return{n:g[k].length,nd:v.length,med:median(v)};};
  const S={};keys.forEach(k=>S[k]=stat(k));
  if(state.catSort==='val')keys.sort((a,b)=>((S[b].med??-1e9)-(S[a].med??-1e9)));

function svgLine(vals,up,srcLabel,leftLabel){
  const W=320,H=100,pad=6,N=vals.length;
  let mn=Math.min(...vals),mx=Math.max(...vals);if(mn===mx){mn-=1;mx+=1;}const rng=mx-mn;
  const X=i=>pad+(N<2?0:i/(N-1))*(W-2*pad);
  const Y=v=>pad+(1-(v-mn)/rng)*(H-2*pad);
  const pts=vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  const col=up?'#22c55e':'#f4536b';const y100=Y(100);
  const area=pts+' '+X(N-1).toFixed(1)+','+(H-pad)+' '+X(0).toFixed(1)+','+(H-pad);
  return '<div class="chartbox"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
    '<polygon points="'+area+'" fill="'+col+'" opacity="0.08"/>'+
    (100>=mn&&100<=mx?'<line x1="'+pad+'" y1="'+y100.toFixed(1)+'" x2="'+(W-pad)+'" y2="'+y100.toFixed(1)+'" stroke="#2b3a57" stroke-width="1" stroke-dasharray="3 3"/>':'')+

    '<div class="chleg"><span>'+leftLabel+'</span><span>'+srcLabel+'</span><span>oggi</span></div></div>';
}
function growthChart(f){
  // storico reale se disponibile
  const raw=SER[f[I.isin]];
  if(raw){ const cum=raw.split(',').map(Number).filter(x=>isFinite(x));
    if(cum.length>=6){ const vals=cum.map(v=>100*(1+v/100)); const up=vals[vals.length-1]>=vals[0];
      const mo=cum.length-1; const left=mo>=60?'5 anni fa':mo>=36?'~3 anni fa':(mo+' mesi fa');
      return svgLine(vals,up,'storico Morningstar · base 100',left);
    }
  }
  const P=[];const push=(mo,val)=>{if(val!=null&&isFinite(val))P.push([mo,val]);};
  push(0,100);if(f[I.w1]!=null)push(0.25,100/(1+f[I.w1]/100));push(1,100/(1+f[I.m1]/100));push(3,100/(1+f[I.m3]/100));push(6,100/(1+f[I.m6]/100));
  if(f[I.ytd]!=null)push(6.7,100/(1+f[I.ytd]/100));
  push(12,100/(1+f[I.r1]/100));
  if(f[I.r3]!=null)push(36,100/Math.pow(1+f[I.r3]/100,3));
  if(f[I.r5]!=null)push(60,100/Math.pow(1+f[I.r5]/100,5));
  if(P.length<2)return'';
  P.sort((a,b)=>b[0]-a[0]); // dal più vecchio (mesi alti) a oggi
  const W=320,H=100,pad=6,maxMo=P[0][0];
  const vals=P.map(p=>p[1]);let mn=Math.min(...vals),mx=Math.max(...vals);if(mn===mx){mn-=1;mx+=1;}
  const rng=mx-mn;
  const X=mo=>pad+(1-mo/maxMo)*(W-2*pad);
  const Y=v=>pad+(1-(v-mn)/rng)*(H-2*pad);
  const pts=P.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');
  const up=P[P.length-1][1]>=P[0][1];const col=up?'#22c55e':'#f4536b';
  const y100=Y(100);
  const area='M'+X(P[0][0]).toFixed(1)+','+Y(P[0][0]).toFixed(1)+' '; // placeholder unused
  let marks=P.map(p=>'<circle cx="'+X(p[0]).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)+'" r="2.4" fill="'+col+'"/>').join('');
  const lbl=mo=>mo>=12?(mo/12)+'a':(mo+'m');
  return '<div class="chartbox"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
    '<line x1="'+pad+'" y1="'+y100.toFixed(1)+'" x2="'+(W-pad)+'" y2="'+y100.toFixed(1)+'" stroke="#2b3a57" stroke-width="1" stroke-dasharray="3 3"/>'+
    '<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+marks+'</svg>'+
    '<div class="chleg"><span>'+(maxMo>=60?'5 anni fa':maxMo>=36?'3 anni fa':(Math.round(maxMo)+' mesi fa'))+'</span><span>stima dai rendimenti · base 100</span><span>oggi</span></div></div>';
}

  }

  var pCopia=fetch('data/bootstrap.json',{cache:'force-cache'})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){ if(vuoto(d)) throw 0; return d; })
    .catch(function(){ return null; });

  var pFresco=fetch('/api/data')
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){ if(vuoto(d)) throw new Error('risposta senza fondi'); return d; })
    .catch(function(){ return null; });

  pCopia.then(function(d){
    if(d) mostra(d, refreshKO ? 'copia-ferma' : 'copia');
  });

  pFresco.then(function(d){
    if(d){ mostra(d,'fresco'); return; }
    refreshKO=true;
    // se la copia sta gia' reggendo, smetti di promettere un aggiornamento
    if(disegnato){ try{ window.__testata('copia-ferma'); }catch(_){ } }
  });

  Promise.all([pCopia,pFresco]).then(function(){ if(!disegnato) errore(); });
})();

</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
